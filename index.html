<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mini Stock Inventory System</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Stock Inventory Management</h1>
  </header>

  <main>
    <section class="form-section">
      <h2 id="form-title">Add Item</h2>
      <form id="item-form">
        <input type="hidden" id="item-id" />
        <div class="row">
          <label>Name</label>
          <input id="name" required />
        </div>
        <div class="row">
          <label>SKU</label>
          <input id="sku" required />
        </div>
        <div class="row">
          <label>Quantity</label>
          <input id="quantity" type="number" min="0" value="0" required />
        </div>
        <div class="row">
          <label>Price</label>
          <input id="price" type="number" step="0.01" min="0" value="0.00" required />
        </div>
        <div class="row">
          <label>Description</label>
          <textarea id="description"></textarea>
        </div>
        <div class="actions">
          <button type="submit" id="save-btn">Add Item</button>
          <button type="button" id="cancel-btn" class="secondary">Cancel</button>
        </div>
      </form>
    </section>

    <section class="list-section">
      <div class="list-head">
        <h2>Inventory</h2>
        <div class="controls">
          <input id="search" placeholder="Search by name or SKU..." />
          <select id="filter">
            <option value="all">All</option>
            <option value="low">Low stock (&lt;=5)</option>
          </select>
        </div>
      </div>

      <table id="items-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>SKU</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Description</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="items-tbody">
          <!-- items rendered here -->
        </tbody>
      </table>
    </section>
  </main>

  <footer>
    <p>Mini project • Firebase Firestore sample</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
